name: Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write   # post the coverage comment

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Fails if coverage drops below the floors in vitest.config.ts
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Coverage report
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2

      # Catches config and bundling breakage before Workers Builds deploys it.
      - name: Build
        run: npm run build
