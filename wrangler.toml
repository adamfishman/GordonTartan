name = "gordon-tartan"
compatibility_date = "2026-10-19"
compatibility_flags = ["nodejs_compat"]
# @astrojs/cloudflare v13+ builds through the Cloudflare Vite plugin; `main` names the
# adapter's entrypoint and the static-assets binding is configured by the adapter.
main = "@astrojs/cloudflare/entrypoints/server"

[[d1_databases]]
binding = "DB"
database_name = "gordon-tartan-db"
database_id = "e0e62aa5-5586-4370-b7d9-e960a8a31437"
